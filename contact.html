<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | SecureTrack BD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: { extend: { colors: { brandRed: '#d32f2f', brandDark: '#1a1a1a' } } }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar Section -->
    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="text-3xl font-extrabold text-brandRed tracking-tight">SecureTrack BD</div>
            <ul class="hidden md:flex space-x-8 font-semibold text-gray-600">
                <li><a href="index.html" class="hover:text-brandRed transition duration-300">Home</a></li>
                <li><a href="shop.html" class="hover:text-brandRed transition duration-300">Shop</a></li>
                <li><a href="pricing.html" class="hover:text-brandRed transition duration-300">Pricing</a></li>
                <li><a href="blog.html" class="hover:text-brandRed transition duration-300">Blog</a></li>
                <li><a href="contact.html" class="text-brandRed border-b-2 border-brandRed pb-1">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contact Section -->
    <div class="max-w-6xl mx-auto py-16 px-6">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-extrabold text-gray-900">Contact Us</h2>
            <p class="mt-4 text-gray-500 text-lg">যেকোনো প্রয়োজনে আমাদের সাথে যোগাযোগ করুন।</p>
        </div>

        <div class="flex flex-col md:flex-row gap-10 bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
            <!-- Contact Info -->
            <div class="md:w-1/3 space-y-6">
                <div>
                    <h3 class="text-xl font-bold text-gray-800">অফিসের ঠিকানা</h3>
                    <p class="text-gray-600 mt-2">উত্তরা, ঢাকা, বাংলাদেশ<br>ভালুকা ব্রাঞ্চ, ময়মনসিংহ</p>
                </div>
                <div>
                    <h3 class="text-xl font-bold text-gray-800">ফোন নম্বর</h3>
                    <p class="text-gray-600 mt-2">+880 1700-000000<br>+880 1900-000000</p>
                </div>
                <div>
                    <h3 class="text-xl font-bold text-gray-800">ইমেইল</h3>
                    <p class="text-brandRed font-semibold mt-2">info@securetrackbd.com</p>
                </div>
            </div>

            <!-- Contact Form -->
            <div class="md:w-2/3">
                <form class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="text" placeholder="আপনার নাম" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-brandRed">
                        <input type="email" placeholder="আপনার ইমেইল" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-brandRed">
                    </div>
                    <input type="text" placeholder="বিষয় (Subject)" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-brandRed">
                    <textarea rows="5" placeholder="আপনার মেসেজ লিখুন..." class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-brandRed"></textarea>
                    <button type="submit" class="bg-brandRed hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition duration-300">মেসেজ পাঠান</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
